name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Swift tests
        run: swift run DesignKitTests

  markdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        run: npx --yes markdownlint-cli@0.49.1 "**/*.md" --ignore node_modules
